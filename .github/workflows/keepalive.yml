name: Keep Render backend awake

# Deshabilitado: los triggers "schedule" de GitHub Actions son "best effort"
# y pueden atrasarse 40-70+ min sin aviso, dejando que Render duerma la
# instancia entre pings. Reemplazado por un ping externo real desde
# cron-job.org cada 10 min. Se deja workflow_dispatch para pruebas manuales.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS "${{ secrets.BACKEND_HEALTH_URL }}"
